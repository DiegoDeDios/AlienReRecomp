# Pre-releases: every push to a feature/ or fix/ branch publishes a test build
# of its head, so people can try it before the pull request is merged. Other
# branches can run it by hand (Actions > Pre-release > Run workflow).
#
# Each branch has one pre-release, tagged v<next version>-pre-<hash of the
# branch name> (tools/next_version.sh, tools/prerelease_id.sh), so branches do
# not clash and a new push replaces the branch's previous one. Deleting the
# branch deletes its pre-release. A branch with no commits of its own is skipped.
# The packages and the launcher show the version as <next version>-pre.
name: Pre-release

on:
  workflow_dispatch:
  push:
    branches: ["feature/**", "fix/**"]
  delete:

permissions:
  contents: read

# a new push or the branch's deletion replaces a running pre-release
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # the job names differ from release.yml's: push runs report on the branch's
  # commits, where "Build (macOS)" etc. are required checks of main

  version:
    name: Pre-release version
    if: github.event_name != 'delete'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.v.outputs.publish }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # main and the existing tags
      - name: Feature branch with its own commits
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" != branch ] || [ "$GITHUB_REF_NAME" = main ]; then
            echo "::error::run this on a feature branch (main is released by release.yml)"
            exit 1
          fi
          if [ "$(git rev-list --count origin/main..HEAD)" = 0 ]; then
            echo "::notice::No pre-release for $GITHUB_REF_NAME: no commits ahead of main"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(tools/next_version.sh)-pre
          tag="v$version-$(tools/prerelease_id.sh "$GITHUB_REF_NAME")"
          {
            echo "publish=true"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Pre-release $tag from $GITHUB_REF_NAME at $GITHUB_SHA"

  # the builds are release.yml's

  macos:
    name: Pre-release build (macOS)
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the version
        run: sh tools/set_version.sh ${{ needs.version.outputs.version }}
      - name: Tools
        run: brew install ninja
      - name: Build AlienResurrection.app (universal)
        run: tools/build_macos_app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: build-mac/release/*.zip
          retention-days: 14

  windows:
    name: Pre-release build (Windows)
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the version
        run: sh tools/set_version.sh ${{ needs.version.outputs.version }}
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 cmake ninja-build zip
      - name: Build AlienResurrection.exe (cross-compiled)
        run: tools/build_windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: build-win/release/*.zip
          retention-days: 14

  linux:
    name: Pre-release build (Linux)
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    # Ubuntu 22.04 (glibc 2.35) so the program also runs on older systems
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the version
        run: sh tools/set_version.sh ${{ needs.version.outputs.version }}
      - name: Tools and SDL3 build dependencies
        run: sh tools/linux/install_deps_ubuntu.sh
      - name: Build AlienResurrection (x86_64)
        run: sh tools/build_linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: build-linux-x86_64/release/*.tar.gz
          retention-days: 14

  pre-release:
    name: Publish pre-release
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the tag and the pre-release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # main and the existing tags
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Notes
        run: |
          {
            echo "**Pre-release for testing:** branch \`$GITHUB_REF_NAME\` at ${GITHUB_SHA:0:7}, ahead of the next release. It may still change before then, and its quick saves do not carry over to the release."
            echo
            echo "## Changes since the last release"
            echo
            git log --no-merges --format='* %s (%h)' origin/main..HEAD
            echo
            cat packaging/RELEASE_NOTES.md
          } > "$RUNNER_TEMP/notes.md"
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # also covers an earlier version of this branch
          tools/delete_prereleases.sh "$GITHUB_REF_NAME"
          # pushed with the workflow's token, so it starts no workflow
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -f -a "$TAG" -m "ARR $TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --prerelease --latest=false \
            --title "ARR $TAG ($GITHUB_REF_NAME)" --notes-file "$RUNNER_TEMP/notes.md" \
            dist/macos/*.zip dist/windows/*.zip dist/linux/*.tar.gz

  cleanup:
    name: Delete pre-release
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the tag and the pre-release
    steps:
      - uses: actions/checkout@v7
      - name: Delete the branch's pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.ref }}
        run: tools/delete_prereleases.sh "$BRANCH"
